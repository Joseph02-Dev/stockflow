[build]
  base = "frontend"
  command = "npm run build"
  # Relatif à `base` ci-dessus, donc "dist" et non "frontend/dist" —
  # sinon Netlify cherche frontend/frontend/dist, qui n'existe pas.
  publish = "dist"

[build.environment]
  # Vite 8 exige Node ^20.19.0 ou >=22.12.0. Sans cette variable, Netlify
  # utilise sa version par défaut (plus ancienne), et le build échoue au
  # moment de tsc/vite avec un code de sortie générique, sans message
  # explicite pointant vers la cause réelle.
  NODE_VERSION = "22.12.0"

# Sans cette règle, toute route gérée par React Router côté client
# (ex. /connexion, /produits) renvoie une 404 : ces chemins n'existent pas
# comme fichiers réels sur le serveur, seul index.html doit répondre et
# laisser React Router prendre la main dans le navigateur.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Mêmes en-têtes de sécurité que Vercel (frontend/vercel.json), pour les
# aperçus Netlify ; un test vérifie qu'ils restent identiques. La CSP
# complète est dans index.html (frontend/securite-contenu.ts).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
