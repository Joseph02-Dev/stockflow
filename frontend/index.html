<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      Apparence posée avant tout rendu : sans ce script bloquant, l'écran
      s'afficherait en clair une fraction de seconde avant de basculer.
      Clé et valeurs partagées avec src/lib/theme.ts. try/catch : en
      navigation privée stricte, localStorage peut lever une exception.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('stockflow.theme') || 'auto';
          var sombre = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (sombre) {
            document.documentElement.setAttribute('data-theme', 'dark');
            // Fond du navigateur sombre avant même l'arrivée de la feuille de style.
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#15161a');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installation (PWA) : Android, ordinateurs, et écran d'accueil iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NimbaFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/ouverture.css" />
    <!--
      Écran d'ouverture : à chaque lancement de l'application installée,
      et une fois par onglet dans le navigateur pour une personne connectée
      (jamais sur les pages publiques). Retiré par src/lib/ouverture.ts.
    -->
    <script>
      (function () {
        try {
          var installee = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
          var connectee = localStorage.getItem('stockflow.session') || sessionStorage.getItem('stockflow.session');
          if (installee || (connectee && !sessionStorage.getItem('stockflow.ouverture'))) {
            document.documentElement.classList.add('ouverture');
            sessionStorage.setItem('stockflow.ouverture', '1');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    />
    <title>NimbaFlow</title>
    <meta
      name="description"
      content="NimbaFlow : gestion de stock et de ventes pour commerçants, grossistes et vendeurs. Produits, mouvements, ventes et alertes dans un espace unique, sur ordinateur ou téléphone."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NimbaFlow" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://stockflowgn.com/" />
    <meta property="og:title" content="NimbaFlow — gestion de stock et de ventes" />
    <meta
      property="og:description"
      content="Produits, mouvements, ventes et alertes dans un espace unique, pour commerçants et grossistes. Essai gratuit."
    />
    <meta property="og:image" content="https://stockflowgn.com/accueil/apercu-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="ouverture" aria-hidden="true">
      <div class="ouverture-contenu">
        <svg class="ouverture-logo" viewBox="0 0 64 64">
          <rect x="7" y="43" width="14" height="14" rx="3" />
          <rect x="25" y="43" width="14" height="14" rx="3" />
          <rect x="43" y="43" width="14" height="14" rx="3" />
          <rect x="25" y="25" width="14" height="14" rx="3" />
          <rect x="43" y="25" width="14" height="14" rx="3" />
          <rect x="43" y="7" width="14" height="14" rx="3" />
        </svg>
        <p class="ouverture-nom">Nimba<span>Flow</span></p>
        <p class="ouverture-slogan">Gestion de stock et de ventes</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
